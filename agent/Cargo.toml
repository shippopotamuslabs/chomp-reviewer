[package]
name = "chomp"
version = "0.1.0"
edition = "2021"
description = "Chomp repo-aware agentic code review host"
license = "MIT"
publish = false

[[bin]]
name = "chomp"
path = "src/main.rs"

[dependencies]
agent_core = { git = "https://github.com/shippopotamuslabs/agent_core", rev = "a096a65f44f9942c97541a029d1b083edee04fdf", default-features = false }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = "3"
