name: Forge Review

# Reusable workflow: one consolidated Forge review per pull request.
#
# Callers (on GitHub) add a small workflow to their repo:
#
#   name: Forge Review
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     forge-review:
#       uses: shippopotamuslabs/forge-reviewer/.github/workflows/forge-review.yml@<tag>
#       secrets: inherit
#
# Required secrets in the CALLER repo:
#   OPENROUTER_API_KEY:     Thermos lenses + master dedup + verify.
#   FORGE_APP_PRIVATE_KEY:  Private key of the Shippopotamus Forge
#                           GitHub App (ID 5455197). The review posts as
#                           shippopotamus-forge[bot] via an installation
#                           token minted in this workflow.
#
# Optional secrets in the CALLER repo:
#   LINEAR_API_KEY:         Forwarded to the PR-Agent producer step only,
#                           so ticket-aware PR-Agent features resolve Linear
#                           tickets for consumers who provide one. Absence
#                           changes nothing.
#
# Behavior mirrors the GitLab template: producers are silent and
# fail-soft (a failed producer never blocks the caller's pipeline),
# master posts one consolidated review, and pushes after the first
# review run verification instead (verdict replies + thread resolution).

on:
  workflow_call:
    inputs:
      forge_ref:
        description: "forge-reviewer ref (tag/SHA/branch) to take the .forge scripts from"
        type: string
        default: "main"
      forge_app_id:
        description: "GitHub App ID for the Forge review identity"
        type: string
        default: "5455197"
      model:
        description: "OpenRouter model ID (empty = Forge default)"
        type: string
        default: ""
      pr_agent_version:
        description: "Pinned PR-Agent version (installed unmodified from PyPI)"
        type: string
        default: "0.46.0"
    secrets:
      OPENROUTER_API_KEY:
        required: true
      FORGE_APP_PRIVATE_KEY:
        required: true
      LINEAR_API_KEY:
        required: false

jobs:
  review:
    name: forge-review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$OPENROUTER_API_KEY" ] && missing="$missing OPENROUTER_API_KEY"
          [ -z "$FORGE_APP_PRIVATE_KEY" ] && missing="$missing FORGE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required Forge secret(s) in the caller repo:$missing"
            exit 1
          fi
          echo "Required Forge secrets are present."

      - name: Mint Forge app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.forge_app_id }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          # v1 scopes the token to the caller repo only unless told otherwise;
          # the Forge scripts checkout needs forge-reviewer in scope too.
          repositories: |
            ${{ github.event.repository.name }}
            forge-reviewer

      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo

      - name: Check out Forge scripts
        uses: actions/checkout@v4
        with:
          repository: shippopotamuslabs/forge-reviewer
          ref: ${{ inputs.forge_ref }}
          path: forge
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR diff
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .forge/fetch_diff_github.py "$GITHUB_API_URL" "$GITHUB_REPOSITORY" \
            "$PR_NUMBER" "$GITHUB_TOKEN" --output mr.diff

      - name: Check for an existing consolidated review
        id: marker
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".forge")
          import github_backend as gh
          api, repo, token = gh.gh_env()
          found = gh.find_marker_comment(
              api, repo, os.environ["PR_NUMBER"], token,
              "forge:consolidated-review")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("exists=%s\n" % ("yes" if found else "no"))
          print("Existing consolidated review:", "yes" if found else "no")
          PY

      - name: PR-Agent producer (silent, plain-diff)
        if: steps.marker.outputs.exists != 'yes'
        working-directory: repo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
          # Ticket context for the PR-Agent handler. LINEAR_API_KEY is
          # optional: when the caller does not provide it the value is
          # empty and nothing changes. PR_REVIEWER__CHECK_PR_ADDITIONAL_CONTENT
          # is the dynaconf env override for pr_reviewer.check_pr_additional_content
          # (same SECTION__KEY convention as CONFIG__MODEL below).
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_REVIEWER__CHECK_PR_ADDITIONAL_CONTENT: "true"
        run: |
          fallback() {
            echo "::warning::$1"
            printf '## PR Reviewer Guide\n\n(%s)\n' "$1" > ../forge/pr-agent-findings.md
          }
          if [ ! -f .pr_agent.toml ]; then
            fallback "PR-Agent skipped: no .pr_agent.toml in the caller repo."
            exit 0
          fi
          MODEL="${FORGE_MODEL:-openrouter/meta/muse-spark-1.3-contributor}"
          if ! ( python3 -m venv /tmp/pr-agent-venv \
              && /tmp/pr-agent-venv/bin/pip install -q "pr-agent==${{ inputs.pr_agent_version }}" \
              && CONFIG__MODEL="$MODEL" \
                 OPENROUTER__KEY="$OPENROUTER_API_KEY" \
                 CONFIG__CUSTOM_MODEL_MAX_TOKENS="1000000" \
                 /tmp/pr-agent-venv/bin/python -m pr_agent.cli \
                   --diff-file=../forge/mr.diff \
                   --output=../forge/pr-agent-findings.md review ); then
            fallback "PR-Agent producer failed in this run."
            exit 0
          fi
          if ! grep -q "## PR Reviewer Guide" ../forge/pr-agent-findings.md; then
            fallback "PR-Agent output lacked the Guide header in this run."
          fi

      - name: Thermos correctness lens
        if: steps.marker.outputs.exists != 'yes'
        working-directory: forge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
        run: |
          if ! python3 .forge/thermos.py --lens correctness \
              --diff mr.diff --output thermos-correctness.json; then
            echo "::warning::Thermos correctness lens failed; using empty findings."
            echo "[]" > thermos-correctness.json
          fi

      - name: Thermos structure lens
        if: steps.marker.outputs.exists != 'yes'
        working-directory: forge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
        run: |
          if ! python3 .forge/thermos.py --lens structure \
              --diff mr.diff --output thermos-structure.json; then
            echo "::warning::Thermos structure lens failed; using empty findings."
            echo "[]" > thermos-structure.json
          fi

      - name: Master — post the consolidated review (verify on re-push)
        continue-on-error: true
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ steps.marker.outputs.exists }}" = "yes" ]; then
            echo "Consolidated review already exists; running verification."
            python3 .forge/verify.py --iid "$PR_NUMBER" --sha "$HEAD_SHA" \
              --diff mr.diff
          else
            echo "No existing review; running full review."
            python3 .forge/master.py --iid "$PR_NUMBER" --sha "$HEAD_SHA" \
              --pr-agent pr-agent-findings.md \
              --thermos-a thermos-correctness.json \
              --thermos-b thermos-structure.json \
              --diff mr.diff
          fi

      - name: Upload Forge run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-recorded
          path: forge/forge-recorded.json
          if-no-files-found: ignore
