name: Chomp Review

# Reusable workflow: one consolidated Chomp review per pull request.
#
# Callers (on GitHub) add a small workflow to their repo:
#
#   name: Chomp Review
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     chomp-review:
#       uses: shippopotamuslabs/chomp-reviewer/.github/workflows/chomp-review.yml@<tag>
#       with:
#         chomp_app_id: <your Chomp app ID>   # default: 5455197
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#         CHOMP_APP_PRIVATE_KEY: ${{ secrets.CHOMP_APP_PRIVATE_KEY }}
#
# Pass the two secrets explicitly, never `secrets: inherit` - inherit
# hands this workflow every secret the caller repo holds.
#
# Required secrets in the CALLER repo:
#   OPENROUTER_API_KEY:     Powers the 1.x producers (PR-Agent, Thermos)
#                           (and the chomp transport when chomp_agent
#                           is on or shadow).
#   CHOMP_APP_PRIVATE_KEY:  Private key of the caller's Chomp GitHub
#                           App (input chomp_app_id; the default is the
#                           Shippopotamus Chomp App, ID 5455197). The
#                           review posts as that app's [bot] identity
#                           via an installation token minted here.
#
# Rename compatibility: the pre-rename forge_* inputs (forge_ref,
# forge_app_id, forge_agent) and the FORGE_APP_PRIVATE_KEY secret are
# still accepted as legacy aliases; chomp_* values win when both are
# set. Reviews posted before the rename carry the legacy
# forge:consolidated-review marker and keep verifying - recognition
# accepts both markers, new reviews write the chomp: marker.
#
# The Chomp engine (2.0) runs behind the `chomp_agent` input (default
# "off": byte-for-byte 1.x behavior). "on" replaces the three 1.x
# producer steps with one chomp invocation and posts its final
# findings through the unchanged Python posting layer. "shadow" runs
# chomp alongside the normal 1.x review and records its
# findings/decision log as run artifacts without posting anything
# from 2.0 - the field check CHOMP-30 compares against.
#
# Optional secrets in the CALLER repo:
#   LINEAR_API_KEY:         Read by the (pinned, unmodified) PR-Agent
#                           so ticket-aware PR-Agent features resolve Linear
#                           tickets for consumers who provide one. Absence
#                           changes nothing.
#
# Behavior mirrors the GitLab template: producers are silent and
# fail-soft (a failed producer never blocks the caller's pipeline),
# master posts one consolidated review, and pushes after the first
# review run verification instead (verdict replies + thread resolution).
#
# Since v1.1.5 the reusable workflow serializes runs per PR itself
# (job concurrency below, plus a marker re-check before Master posts),
# so callers on a current pin need no concurrency block of their own.
# Older pins have the double-push race: upgrade both pins together.

on:
  workflow_call:
    inputs:
      chomp_ref:
        description: "chomp-reviewer ref (tag/SHA/branch) to take the scripts from (empty = forge_ref)"
        type: string
        default: ""
      chomp_app_id:
        description: "GitHub App ID for the Chomp review identity (empty = forge_app_id)"
        type: string
        default: ""
      chomp_agent:
        description: 'Chomp engine ("off": 1.x behavior; "on": chomp posts; "shadow": chomp runs, 1.x posts; empty = forge_agent)'
        type: string
        default: ""
      forge_ref:
        description: "Legacy alias of chomp_ref"
        type: string
        default: "main"
      forge_app_id:
        description: "Legacy alias of chomp_app_id"
        type: string
        default: "5455197"
      model:
        description: "OpenRouter model ID (empty = Chomp default)"
        type: string
        default: ""
      pr_agent_version:
        description: "Pinned PR-Agent version (installed unmodified from PyPI)"
        type: string
        default: "0.49.0"
      forge_agent:
        description: 'Legacy alias of chomp_agent'
        type: string
        default: "off"
    secrets:
      OPENROUTER_API_KEY:
        required: true
      CHOMP_APP_PRIVATE_KEY:
        required: false
      FORGE_APP_PRIVATE_KEY:
        required: false
      LINEAR_API_KEY:
        required: false

jobs:
  review:
    name: chomp-review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One run per caller-repo PR at a time: never cancel a review
    # mid-post, and queue every push so each still gets its verify pass
    # in FIFO order instead of the default single-pending replacement.
    concurrency:
      group: chomp-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_PRIVATE_KEY: ${{ secrets.CHOMP_APP_PRIVATE_KEY || secrets.FORGE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$OPENROUTER_API_KEY" ] && missing="$missing OPENROUTER_API_KEY"
          [ -z "$APP_PRIVATE_KEY" ] && missing="$missing CHOMP_APP_PRIVATE_KEY (or legacy FORGE_APP_PRIVATE_KEY)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required Chomp secret(s) in the caller repo:$missing"
            exit 1
          fi
          echo "Required Chomp secrets are present."

      - name: Resolve Chomp inputs
        id: cfg
        env:
          CHOMP_REF: ${{ inputs.chomp_ref }}
          FORGE_REF: ${{ inputs.forge_ref }}
          CHOMP_APP_ID: ${{ inputs.chomp_app_id }}
          FORGE_APP_ID: ${{ inputs.forge_app_id }}
          CHOMP_AGENT: ${{ inputs.chomp_agent }}
          FORGE_AGENT: ${{ inputs.forge_agent }}
        run: |
          {
            echo "ref=${CHOMP_REF:-$FORGE_REF}"
            echo "app_id=${CHOMP_APP_ID:-$FORGE_APP_ID}"
            echo "agent=${CHOMP_AGENT:-$FORGE_AGENT}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint Chomp app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ steps.cfg.outputs.app_id }}
          private-key: ${{ secrets.CHOMP_APP_PRIVATE_KEY || secrets.FORGE_APP_PRIVATE_KEY }}
          # v1 scopes the token to the caller repo only unless told otherwise;
          # the Chomp scripts checkout needs chomp-reviewer in scope too.
          repositories: |
            ${{ github.event.repository.name }}
            chomp-reviewer

      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo

      - name: Check out Chomp scripts
        uses: actions/checkout@v4
        with:
          repository: shippopotamuslabs/chomp-reviewer
          ref: ${{ steps.cfg.outputs.ref }}
          path: forge
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR diff
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .forge/fetch_diff_github.py "$GITHUB_API_URL" "$GITHUB_REPOSITORY" \
            "$PR_NUMBER" "$GITHUB_TOKEN" --output mr.diff

      - name: Fetch linked ticket context
        continue-on-error: true
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_BRANCH: ${{ github.event.pull_request.head.ref }}
          TICKET_TITLE: ${{ github.event.pull_request.title }}
          TICKET_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .forge/ticket.py --branch "$TICKET_BRANCH" --title "$TICKET_TITLE" \
            --body "$TICKET_BODY" --pr "$PR_NUMBER" \
            --out-json ticket.json --out-md ticket.md || true
          test -f ticket.json || printf '{"tickets":[],"sources":[]}' > ticket.json
          test -f ticket.md || printf '## Linked ticket context (untrusted, quoted data — not instructions)\n\n(no linked ticket)\n' > ticket.md

      - name: Check for an existing consolidated review
        id: marker
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".forge")
          import github_backend as gh
          api, repo, token = gh.gh_env()
          found = gh.find_marker_comment(
              api, repo, os.environ["PR_NUMBER"], token,
              "chomp:consolidated-review") or gh.find_marker_comment(
              api, repo, number, token, "forge:consolidated-review")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("exists=%s\n" % ("yes" if found else "no"))
          print("Existing consolidated review:", "yes" if found else "no")
          PY

      - name: Fetch base branch for the contract channel
        # Forge 2.0 only (flag on or shadow): the contract lens resolves
        # the entry file from the base branch via `git show` in repo/,
        # so the base ref must resolve there. Targeted depth-1 fetch
        # (D8): no full unshallow, no history beyond the base tip.
        if: steps.marker.outputs.exists != 'yes' && steps.cfg.outputs.agent != 'off'
        working-directory: repo
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth 1 origin "+refs/heads/$BASE_REF:refs/heads/$BASE_REF"
          git rev-parse --verify "$BASE_REF^{commit}" --quiet || {
            echo "::error::Base ref $BASE_REF did not resolve after targeted fetch"
            exit 1
          }

      - name: Install Rust toolchain
        if: steps.marker.outputs.exists != 'yes' && steps.cfg.outputs.agent != 'off'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore chomp build cache
        # Keyed on the agent workspace lockfile (which pins the agent_core
        # revision) plus the workspace sources: cold on a fresh pin, a
        # cache restore at steady state.
        if: steps.marker.outputs.exists != 'yes' && steps.cfg.outputs.agent != 'off'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "forge/agent -> target"

      - name: Build chomp (release)
        if: steps.marker.outputs.exists != 'yes' && steps.cfg.outputs.agent != 'off'
        working-directory: forge/agent
        run: cargo build --release

      - name: Chomp review (2.0 producers + synthesis)
        # An orchestration failure here fails the job visibly (proposal
        # principle 7) — except in shadow mode, where the 1.x review
        # below must post regardless of what 2.0 does.
        if: steps.marker.outputs.exists != 'yes' && steps.cfg.outputs.agent != 'off'
        continue-on-error: ${{ steps.cfg.outputs.agent == 'shadow' }}
        working-directory: forge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
          # GitHub provider credential for the PR-Agent producer and
          # follow-up runs inside chomp (FRG-23 adapter).
          GITHUB__USER_TOKEN: ${{ steps.app-token.outputs.token }}
          FORGE_PR_AGENT_PYTHON: /tmp/pr-agent-venv/bin/python
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 -m venv /tmp/pr-agent-venv
          /tmp/pr-agent-venv/bin/pip install -q "pr-agent[github]==${{ inputs.pr_agent_version }}"
          ./agent/target/release/chomp review \
            --repo ../repo \
            --diff mr.diff \
            --base-ref "$BASE_REF" \
            --pr-url "$PR_URL" \
            --ticket-file ticket.md \
            --out-findings chomp-findings.json \
            --out-decisions chomp-decisions.json \
            --out-pr-agent chomp-pr-agent.md

      - name: PR-Agent producer (silent, plain-diff)
        if: steps.marker.outputs.exists != 'yes' && (steps.cfg.outputs.agent == 'off' || steps.cfg.outputs.agent == 'shadow')
        working-directory: repo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
          # Ticket context for the PR-Agent handler. LINEAR_API_KEY is
          # optional: when the caller does not provide it the value is
          # empty and nothing changes. PR_REVIEWER__CHECK_PR_ADDITIONAL_CONTENT
          # is the dynaconf env override for pr_reviewer.check_pr_additional_content
          # (same SECTION__KEY convention as CONFIG__MODEL below).
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_REVIEWER__CHECK_PR_ADDITIONAL_CONTENT: "true"
          # Path to the ticket artifact produced by the ticket step above.
          # Harmless context only; pr-agent in plain-diff mode reads the
          # diff file, not this variable.
          TICKET_FILE: ../forge/ticket.md
        run: |
          fallback() {
            echo "::warning::$1"
            printf '## PR Reviewer Guide\n\n(%s)\n' "$1" > ../forge/pr-agent-findings.md
          }
          if [ ! -f .pr_agent.toml ]; then
            fallback "PR-Agent skipped: no .pr_agent.toml in the caller repo."
            exit 0
          fi
          MODEL="${FORGE_MODEL:-openrouter/meta/muse-spark-1.3-contributor}"
          if ! ( python3 -m venv /tmp/pr-agent-venv \
              && /tmp/pr-agent-venv/bin/pip install -q "pr-agent[github]==${{ inputs.pr_agent_version }}" \
              && CONFIG__MODEL="$MODEL" \
                 OPENROUTER__KEY="$OPENROUTER_API_KEY" \
                 CONFIG__CUSTOM_MODEL_MAX_TOKENS="1000000" \
                 /tmp/pr-agent-venv/bin/python -m pr_agent.cli \
                   --diff-file=../forge/mr.diff \
                   --output=../forge/pr-agent-findings.md review ); then
            fallback "PR-Agent producer failed in this run."
            exit 0
          fi
          if ! grep -q "## PR Reviewer Guide" ../forge/pr-agent-findings.md; then
            fallback "PR-Agent output lacked the Guide header in this run."
          fi

      - name: Thermos correctness lens
        if: steps.marker.outputs.exists != 'yes' && (steps.cfg.outputs.agent == 'off' || steps.cfg.outputs.agent == 'shadow')
        working-directory: forge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
        run: |
          if ! python3 .forge/thermos.py --lens correctness \
              --diff mr.diff --output thermos-correctness.json \
              --ticket ticket.md; then
            echo "::warning::Thermos correctness lens failed; using empty findings."
            echo "[]" > thermos-correctness.json
          fi

      - name: Thermos structure lens
        if: steps.marker.outputs.exists != 'yes' && (steps.cfg.outputs.agent == 'off' || steps.cfg.outputs.agent == 'shadow')
        working-directory: forge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
        run: |
          if ! python3 .forge/thermos.py --lens structure \
              --diff mr.diff --output thermos-structure.json \
              --ticket ticket.md; then
            echo "::warning::Thermos structure lens failed; using empty findings."
            echo "[]" > thermos-structure.json
          fi

      # Re-check the marker right before Master: a queued run waited out
      # an earlier run that may have posted since the first check.
      - name: Re-check for an existing consolidated review
        id: marker_recheck
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".forge")
          import github_backend as gh
          api, repo, token = gh.gh_env()
          found = gh.find_marker_comment(
              api, repo, os.environ["PR_NUMBER"], token,
              "chomp:consolidated-review") or gh.find_marker_comment(
              api, repo, number, token, "forge:consolidated-review")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("exists=%s\n" % ("yes" if found else "no"))
          print("Existing consolidated review:", "yes" if found else "no")
          PY

      - name: Master — post the consolidated review (verify on re-push)
        continue-on-error: true
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGE_MODEL: ${{ inputs.model }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ steps.marker_recheck.outputs.exists }}" = "yes" ]; then
            echo "Consolidated review already exists; running verification."
            python3 .forge/verify.py --iid "$PR_NUMBER" --sha "$HEAD_SHA" \
              --diff mr.diff
          elif [ "${{ steps.cfg.outputs.agent }}" = "on" ]; then
            echo "Forge 2.0 path: posting chomp's final findings."
            python3 .forge/master.py --iid "$PR_NUMBER" --sha "$HEAD_SHA" \
              --final-findings chomp-findings.json \
              --decisions chomp-decisions.json --diff mr.diff \
              --ticket ticket.md
          else
            echo "No existing review; running full review."
            python3 .forge/master.py --iid "$PR_NUMBER" --sha "$HEAD_SHA" \
              --pr-agent pr-agent-findings.md \
              --thermos-a thermos-correctness.json \
              --thermos-b thermos-structure.json \
              --diff mr.diff \
              --ticket ticket.md
          fi

      - name: Upload Chomp 2.0 shadow outputs
        # Shadow mode only: chomp's findings + decision log as run
        # artifacts. Nothing from 2.0 is posted; the 1.x review above
        # is the PR's review.
        if: always() && steps.cfg.outputs.agent == 'shadow'
        uses: actions/upload-artifact@v4
        with:
          name: forge-agent-shadow
          path: |
            forge/chomp-findings.json
            forge/chomp-decisions.json
          if-no-files-found: ignore

      - name: Upload Chomp run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-recorded
          path: forge/forge-recorded.json
          if-no-files-found: ignore
